[package]
name = "onnx-rs"
version = "1.0.0"
edition = "2024"
authors = ["ronakgh {ronakgh97@gmail.com}"]
description = "A small pure rust implementation of onnx runtime"
license = "MIT"
repository = "https://github.com/ronakgh97/onnx_rs"
readme = "README.md"
categories = ["artificial-intelligence"]
keywords = ["onnx", "runtimes", "inference", "neural-networks", "ai"]

[lib]
name = "onnx_rs"
path = "src/lib.rs"

[profile.dev]
opt-level = 0
lto = "off"
debug = "full"

[profile.release]
opt-level = 2
lto = "fat"
debug = false

[dependencies]
prost = "0.14.6"
memmap2 = "0.9.12"
rustc-hash = "2.1.3"
blas-rs = { git = "https://github.com/ronakgh97/blas-rs" }
anyhow = "1.0.104"

[dev-dependencies]
ort = { git = "https://github.com/pykeio/ort" }
image = "0.25.10"